plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.144'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods must target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
}

// Three layers, one direction of dependency:
//
//   domain   <--  main (the client: engine, mixins, data, api)  <--  gametest (the booth)
//     ^
//     +----  test (plain JUnit; no Minecraft on its classpath at all)
//
// `domain` is the pure layer: what light a set of sources casts at a block,
// which blocks a change touches. Compiled against nothing but the JDK, so a
// `net.minecraft` import there is a compile error. `main` is the client
// mod. `gametest` is the photo booth, a mod of its own, never shipped: a
// client-only mod has nothing for a headless server to test, so the booth
// is its gate.
sourceSets {
    domain
    gametest
}

// The booth has its own game directory, run/booth. It makes its own world
// (flat, night) and its own props, so there are no fixtures to write; only
// the old photos and the save are cleared, so a missing one is noticed and
// the game does not reopen the last run's world under the fresh one's name.
// Jars dropped in run/booth/mods load (a shader pack's mods, say); jars on
// the classpath are not discovered as mods by a dev launch.
var prepareBooth = tasks.register("prepareBooth") {
    def booth = layout.projectDirectory.dir('run/booth').asFile
    outputs.upToDateWhen { false }
    doLast {
        new File(booth, 'screenshots').deleteDir()
        new File(booth, 'saves').deleteDir()
    }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
        }
        // The client-side check: makes a flat world at night, holds a torch,
        // drops a glowstone block, sets a zombie alight, photographs each with
        // the engine off and on, and reads the photos back -- see
        // LuminanceBooth in the gametest source set. Needs a display.
        photoBooth {
            client()
            sourceSet = sourceSets.gametest
            gameDirectory = file('run/booth')
            systemProperty 'luminance.photobooth', 'true'
            taskBefore prepareBooth
        }
        configureEach {
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.domain)
            sourceSet(sourceSets.main)
        }
        "${mod_id}_gametest" {
            sourceSet(sourceSets.gametest)
        }
    }

    // Deliberately not `domain` and not `test` -- see the layering comment.
    addModdingDependenciesTo(sourceSets.gametest)
}

// The booth mod is for the booth run only.
neoForge.runs.matching { it.name != 'photoBooth' }.configureEach {
    loadedMods = neoForge.mods.matching { it.name != "${mod_id}_gametest" }
}

dependencies {
    implementation sourceSets.domain.output

    gametestImplementation sourceSets.main.output
    gametestImplementation sourceSets.domain.output

    // Plain JUnit 5 against the pure layer only. Gradle 9 no longer injects
    // the platform launcher, so it is declared.
    testImplementation sourceSets.domain.output
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.9.2'
    testRuntimeOnly    'org.junit.jupiter:junit-jupiter-engine:5.9.2'
    testRuntimeOnly    'org.junit.platform:junit-platform-launcher:1.9.2'
}

tasks.named('test', Test) {
    // Gradle enables -ea for Test tasks by default; the domain layer's rep
    // invariants are `assert`s and rely on it.
    useJUnitPlatform()
}

// The shipped jar is main + domain. gametest is never shipped.
jar {
    from sourceSets.domain.output
}

// The booth's verdict lines are the assertion. It needs a display, so
// `check` runs it unless asked not to (`-PskipBooth`).
tasks.named('runPhotoBooth') { task ->
    def logFile = layout.projectDirectory.file('run/booth/logs/latest.log').asFile
    task.doLast {
        def text = logFile.exists() ? logFile.text : ''
        if (text =~ /Missing or unsupported mandatory|Mod loading has failed/) {
            throw new GradleException("booth: the loader refused a mod; see ${logFile}")
        }
        def failures = text.readLines().findAll { it.contains('booth: FAIL') }
        if (!failures.isEmpty()) {
            throw new GradleException("booth: ${failures.size()} failed check(s):\n" + failures.join('\n'))
        }
        if (!(text =~ /booth: PASS/)) {
            throw new GradleException("booth: no verdict in ${logFile} -- the booth never ran")
        }
        task.logger.lifecycle("booth: " + (text =~ /booth: PASS.*/)[0])
    }
}
if (!project.hasProperty('skipBooth')) {
    tasks.named('check') { dependsOn 'runPhotoBooth' }
}

// Consumers compile against and nest this artifact Jar-in-Jar. Until a real
// Maven repository exists, `./gradlew publishToMavenLocal` is how it is
// shared, the same path a third-party author would use against a real one.
publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
